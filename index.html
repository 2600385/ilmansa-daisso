<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>일만사 다있소</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
/* 레이아웃: 흰 바탕 + 모서리 파스텔(H안). 준비 모드 = 카드 바둑판, 거래처 모드 = 번호 매긴 큰 제안 카드 */
:root{
  --bg:#F4F6F9; --surface:#FFFFFF; --line:#E4E8EF; --line-2:#D5DBE6;
  --ink:#1F2A44; --muted:#4A5370; --sub:#5A6480;
  --navy:#2E4A78; --navy-d:#223A61; --navy-soft:#EEF2F8;
  --gold:#B8935A; --gold-ink:#7A5A26; --gold-soft:#F6EEDD;
  --hl:#FFE9A8; --ok:#1F6B52; --ok-soft:#E3F2EC; --warn:#8A4B12; --warn-soft:#FCEBDD;
  --font:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.55}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--navy);outline-offset:2px}
h1,h2,h3{text-wrap:balance}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--sub)}
.hl{color:var(--navy);background:linear-gradient(transparent 60%,var(--hl) 60%,var(--hl) 92%,transparent 92%);padding:0 2px}

/* 로고: "있"의 ㅆ만 까딱 */
.logo{margin:0;font-weight:900;letter-spacing:-1.5px;color:var(--navy);line-height:1.1}
.logo .ss{position:relative;display:inline-block}
.logo .ss .top{display:inline-block;clip-path:inset(-30% -30% 37.5% -30%)}
.logo .ss .bot{position:absolute;left:0;top:0;clip-path:inset(62.5% -30% -30% -30%);transform-origin:50% 82%;animation:wig 2.4s ease-in-out infinite}
@keyframes wig{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(5deg) translateY(-1px)}}
.rainbow{width:140px;height:5px;border-radius:3px;background:linear-gradient(90deg,#FFB7D5,#FFD8B5,#FFE9A8,#BDF0D6,#B4DAFF,#D6C9FF)}

/* 공통 컨트롤 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:12px;border:1px solid transparent;font-weight:700;font-size:15px;text-decoration:none;white-space:nowrap}
.btn-primary{background:var(--navy);color:#FFFFFF}
.btn-primary:hover{background:var(--navy-d)}
.btn-line{background:var(--surface);border-color:var(--line-2);color:var(--navy)}
.btn-line:hover{border-color:var(--navy)}
.btn-gold{background:var(--gold-soft);border-color:#E7D6B3;color:var(--gold-ink)}
.btn-gold.on{background:var(--gold);border-color:var(--gold);color:#FFFFFF}
.btn-ghost{background:transparent;color:var(--sub);text-decoration:underline;padding:0 10px;font-weight:500;font-size:14px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.field{width:100%;min-height:48px;padding:0 14px;border:1px solid var(--line-2);border-radius:12px;background:var(--surface)}
textarea.field{min-height:110px;padding:12px 14px;resize:vertical}
.field:focus{border-color:var(--navy)}
label.lb{font-size:14px;font-weight:700}
.chk{display:inline-flex;align-items:center;gap:8px;min-height:44px;font-size:15px}
.chk input{width:18px;height:18px;accent-color:var(--navy)}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;letter-spacing:.3px;border-radius:6px;padding:3px 8px;white-space:nowrap}
.k-tool{background:#E8EDFF;color:#2B44A8}.k-bd,.k-brochure{background:#FDEBDF;color:#A8401A}.k-site{background:#E1F5EC;color:#0B6B50}.k-notice{background:#F1ECFA;color:#5B3FA0}.k-edu{background:#E3F2EC;color:#1F6B52}.k-script{background:var(--navy-soft);color:var(--navy)}
.a-doc{background:var(--gold-soft);color:var(--gold-ink)}.a-in{background:#EEF0F5;color:var(--muted)}

/* 헤더 */
header.top{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:var(--surface)}
.top-in{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;padding-block:12px}
.brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:20px;letter-spacing:-.5px;color:var(--navy)}
.top-r{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.mode{display:inline-flex;padding:4px;border-radius:14px;background:var(--navy-soft);gap:4px}
.mode button{min-height:40px;padding:0 14px;border-radius:10px;border:0;background:transparent;color:var(--muted);font-weight:700;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.mode button.on{background:var(--surface);color:var(--navy);box-shadow:0 2px 6px rgba(46,74,120,.12)}
.nav{display:flex;flex-wrap:wrap;gap:6px;padding-bottom:10px}
.nav button{min-height:40px;padding:0 14px;border-radius:10px;border:1px solid transparent;background:transparent;color:var(--muted);font-weight:700;font-size:15px}
.nav button.on{background:var(--navy);color:#FFFFFF}
.nav button:not(.on):hover{border-color:var(--line-2)}

/* 준비 모드 */
.hero{border-radius:20px;padding:36px 34px;background-color:var(--surface);border:1px solid var(--line);background-image:radial-gradient(circle at 95% 0%,rgba(227,226,255,.9),transparent 42%),radial-gradient(circle at 78% 125%,rgba(255,226,240,.9),transparent 48%),radial-gradient(circle at 0% 110%,rgba(203,232,255,.8),transparent 40%);display:flex;flex-direction:column;gap:14px}
.hero .logo{font-size:clamp(36px,7vw,52px)}
.hero p{margin:0;font-size:17px;color:var(--muted)}
.search{position:relative;max-width:620px}
.search svg{position:absolute;left:17px;top:16px}
.search input{width:100%;min-height:54px;padding:0 18px 0 50px;border:1px solid var(--line-2);border-radius:14px;background:var(--surface);font-size:17px}
.search input:focus{border-color:var(--navy)}
.tabs{display:flex;flex-wrap:wrap;gap:8px}
.tab{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;border-radius:10px;border:1px solid #DDE2EA;background:var(--surface);color:var(--navy);font-size:15px;font-weight:500}
.tab:hover{border-color:#A9B4C8}
.tab.on{background:var(--navy);border-color:var(--navy);color:#FFFFFF}
.tab .dot{width:8px;height:8px;border-radius:4px}
.tab .n{font-size:13px;opacity:.65}
.prompt{display:flex;flex-direction:column;align-items:center;gap:6px;padding:40px 20px;border-radius:20px;background:var(--surface);border:1px solid var(--line);text-align:center}
.prompt b{font-size:20px;color:var(--navy)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
.card{background:var(--surface);border-radius:18px;padding:20px;border:1px solid var(--line);box-shadow:0 6px 16px rgba(31,42,68,.05);display:flex;flex-direction:column;gap:10px;min-width:0;animation:fade .25s ease-out both}
@keyframes fade{from{transform:translateY(6px)}to{transform:none}}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:8px}
.card-h .tags{display:flex;flex-wrap:wrap;gap:6px}
.card h3{margin:0;font-size:18px;font-weight:700}
.card p{margin:0;font-size:14px;color:var(--muted);flex-grow:1}
.card .meta{font-size:13px;color:var(--sub)}
.card .acts{display:flex;gap:8px}
.card .acts .btn{flex:1}
.star{width:44px;height:44px;border:0;background:transparent;border-radius:22px;display:inline-flex;align-items:center;justify-content:center;flex:none}
.star:hover{background:#F0F2F7}
.star path{fill:none;stroke:#8C97AD}
.star.on path{fill:#D9B25F;stroke:#B8935A}
.note-in{font-size:12px;color:var(--sub);text-align:center}
.req{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding:20px 24px;border-radius:16px;background:var(--surface);border:1px solid var(--line)}
.basket-bar{position:fixed;left:0;right:0;bottom:0;z-index:30;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));padding-top:12px;background:rgba(255,255,255,.96);border-top:1px solid var(--line);box-shadow:0 -6px 20px rgba(31,42,68,.08)}
.basket-in{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
.basket-list{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.bk-row{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:12px;background:var(--bg)}
.bk-row .num{width:28px;height:28px;border-radius:14px;background:var(--navy);color:#FFFFFF;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;flex:none}
.bk-row .nm{flex:1;min-width:0;font-weight:500;overflow-wrap:anywhere}
.icon-btn{width:40px;height:40px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;color:var(--navy);flex:none}
.icon-btn[disabled]{opacity:.35;cursor:not-allowed}

/* 거래처 모드 */
.clinic{background:var(--surface);min-height:calc(100vh - 70px)}
.clinic-hero{padding-block:44px 28px;display:flex;flex-direction:column;gap:12px;border-bottom:1px solid var(--line)}
.clinic-hero .eyebrow{font-size:13px;font-weight:700;letter-spacing:1.5px;color:var(--gold-ink)}
.clinic-hero h1{margin:0;font-size:clamp(26px,4.6vw,38px);font-weight:900;letter-spacing:-1px;color:var(--navy);line-height:1.25}
.hosp{display:inline-flex;align-items:center;gap:8px;flex-wrap:wrap}
.hosp input{min-height:44px;width:min(260px,100%);padding:0 12px;border:1px dashed var(--line-2);border-radius:10px;background:var(--bg);font-size:16px}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px;padding-block:32px 60px}
.step{display:flex;flex-direction:column;gap:12px;text-align:left;padding:26px;border-radius:18px;border:1px solid var(--line);background:var(--surface);box-shadow:0 10px 26px rgba(46,74,120,.07)}
.step:hover{border-color:var(--navy)}
.step .no{font-size:15px;font-weight:900;color:var(--gold-ink);letter-spacing:1px}
.step h2{margin:0;font-size:22px;font-weight:700;color:var(--ink)}
.step p{margin:0;color:var(--muted);font-size:15px;flex-grow:1}
.step .go{font-weight:700;color:var(--navy);display:inline-flex;align-items:center;gap:6px}
.present{position:fixed;inset:0;z-index:50;background:var(--surface);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.present-bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;padding-block:10px;border-bottom:1px solid var(--line)}
.present-body{flex:1;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--bg)}
.present-frame{flex:1;width:100%;border:0;background:#FFFFFF}
.present-ph{max-width:560px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;padding:40px 28px;border:2px dashed var(--line-2);border-radius:20px;background:var(--surface)}

/* 표준멘트 */
.stage{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stage button{min-height:64px;padding:8px 12px;border-radius:14px;border:1px solid var(--line-2);background:var(--surface);color:var(--muted);font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;line-height:1.3}
.stage button small{font-weight:500;font-size:12px}
.stage button.on{border-color:var(--navy);background:var(--navy);color:#FFFFFF}
.sc-list{display:flex;flex-direction:column;gap:12px}
.sc{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 20px;display:flex;flex-direction:column;gap:10px}
.sc h3{margin:0;font-size:17px}
.sc .q{font-weight:700;color:var(--navy)}
.sc blockquote{margin:0;padding:12px 14px;border-radius:12px;background:var(--bg);color:var(--muted);white-space:pre-line}
.sc .acts{display:flex;flex-wrap:wrap;gap:8px}
.inbanner{display:flex;align-items:center;gap:10px;padding:12px 16px;border-radius:12px;background:#EEF0F5;color:var(--muted);font-size:14px}

/* 관리자 */
.subtabs{display:flex;flex-wrap:wrap;gap:6px;border-bottom:1px solid var(--line);padding-bottom:10px}
.subtabs button{min-height:40px;padding:0 14px;border-radius:10px;border:0;background:transparent;color:var(--muted);font-weight:700}
.subtabs button.on{background:var(--navy-soft);color:var(--navy)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px}
.tbl-box{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:640px;font-size:14px}
th,td{text-align:left;padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:13px;color:var(--sub);font-weight:700;background:#FAFBFC}
tr:last-child td{border-bottom:0}
td.n{font-variant-numeric:tabular-nums;text-align:right}
th.n{text-align:right}
.bar{height:8px;border-radius:4px;background:var(--navy-soft);min-width:60px;position:relative}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--navy)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.kpi .v{font-size:28px;font-weight:900;color:var(--navy);font-variant-numeric:tabular-nums}
.kpi .l{font-size:13px;color:var(--sub)}
.todo{display:flex;flex-direction:column;gap:8px}
.todo div{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-size:14px}
.todo .pill{flex:none}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.form-grid .full{grid-column:1/-1}
.fg{display:flex;flex-direction:column;gap:6px;min-width:0}
.checks{display:flex;flex-wrap:wrap;gap:4px 16px}
.preview-flag{font-size:12px;font-weight:700;color:var(--warn);background:var(--warn-soft);border-radius:6px;padding:3px 8px}

/* 로그인 */
.login{min-height:100vh;padding-block:48px;display:flex;align-items:center;justify-content:center;background-color:#F4F6FA;background-image:radial-gradient(circle at 12% 18%,rgba(203,232,255,.85),transparent 38%),radial-gradient(circle at 88% 82%,rgba(255,226,240,.85),transparent 42%),radial-gradient(circle at 80% 15%,rgba(227,226,255,.7),transparent 35%)}
.login form{width:100%;max-width:420px;background:var(--surface);border-radius:20px;padding:40px 30px;box-shadow:0 20px 50px rgba(46,74,120,.12);display:flex;flex-direction:column;gap:14px}
.login .logo{font-size:44px;text-align:center}

/* 모달·토스트 */
.modal-bg{position:fixed;inset:0;z-index:60;background:rgba(31,42,68,.45);display:flex;align-items:center;justify-content:center;padding:16px}
.modal{width:100%;max-width:520px;max-height:90vh;overflow:auto;background:var(--surface);border-radius:18px;padding:24px;display:flex;flex-direction:column;gap:14px}
.modal h2{margin:0;font-size:20px}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:70;background:var(--ink);color:#FFFFFF;padding:12px 18px;border-radius:12px;font-size:14px;max-width:min(92vw,520px);text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.2)}
section.blk{display:flex;flex-direction:column;gap:14px}
section.blk>h2{margin:0;font-size:20px;font-weight:700}
.page{display:flex;flex-direction:column;gap:28px;padding-block:24px 140px}

@media (max-width:640px){
  .hero{padding:26px 20px}
  .toolbar .mode{width:100%}
  .toolbar .btn-gold{width:100%}
  .mode{width:100%}.mode button{flex:1;justify-content:center;padding:0 8px;white-space:nowrap}
  .form-grid{grid-template-columns:minmax(0,1fr)}
  .stage button{min-height:72px;font-size:14px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.simple-sw{display:inline-flex;align-items:center;gap:8px;min-height:36px;padding:0 10px;border:0;background:transparent;color:var(--sub);font-size:13px;font-weight:500}
.simple-sw .knob{width:32px;height:18px;border-radius:9px;background:var(--line-2);position:relative;transition:background .15s}
.simple-sw .knob::after{content:"";position:absolute;left:2px;top:2px;width:14px;height:14px;border-radius:7px;background:#FFFFFF;transition:left .15s}
.simple-sw.on{color:var(--navy)}.simple-sw.on .knob{background:var(--navy)}.simple-sw.on .knob::after{left:16px}
.clinic-simple{display:flex;justify-content:flex-end;padding-top:12px}
.clinic-simple+.steps{padding-top:8px}
.guide{display:flex;gap:10px;align-items:flex-start;padding:12px 16px;border-radius:12px;background:var(--gold-soft);color:var(--gold-ink);font-size:14px;line-height:1.6}
.guide svg{flex:none;margin-top:2px}
.guide b{color:var(--ink)}
.brand .bt{font-size:16px;font-weight:700;color:var(--ink);letter-spacing:-.3px;line-height:1.3}
.brand .bs{font-size:12px;font-weight:500;color:#9AA1AE;letter-spacing:.2px;line-height:1.3}
.brand svg{flex:none}
.brand{border:0;background:transparent;padding:0;text-align:left;cursor:pointer}
.brand>span{display:flex;flex-direction:column}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}

/* 2단 배치: 왼쪽 목록, 오른쪽 제안서 칸 (PC) */
.layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:24px;align-items:start}
.main{display:flex;flex-direction:column;gap:28px;min-width:0}
.basket-side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 88px)}
.bk-panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:12px;box-shadow:0 8px 20px rgba(31,42,68,.06)}
.bk-head{display:flex;align-items:center;justify-content:space-between}
.bk-title{display:inline-flex;align-items:center;gap:8px;font-size:17px;font-weight:700;color:var(--navy)}
.bk-cnt{min-width:26px;height:26px;padding:0 8px;border-radius:13px;background:var(--navy);color:#FFFFFF;font-size:13px;font-weight:700;display:inline-flex;align-items:center;justify-content:center}
.bk-empty{margin:0;font-size:14px;color:var(--muted);line-height:1.6;padding:14px;border-radius:12px;background:var(--bg)}
.bk-opts{display:flex;align-items:center;justify-content:space-between;gap:8px}
.bk-go{width:100%}
.basket-bar{display:none}
/* 분류 묶음 */
.filters{display:flex;flex-wrap:wrap;gap:10px}
.fgroup{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:6px;border-radius:16px;background:#E9EDF3}
.flab{font-size:14px;font-weight:700;color:var(--muted);padding:0 8px 0 10px}
.list-h{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:36px}
.simple-sw.fav .st{color:#D9B25F;font-size:15px}
.simple-sw.fav.on{color:var(--gold-ink)}.simple-sw.fav.on .knob{background:var(--gold)}
.who{display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap}
@media (max-width:900px){
  .layout{grid-template-columns:minmax(0,1fr)}
  .basket-side{display:none}
  .basket-bar{display:block}
  .basket-bar .bk-panel{box-shadow:none;border:0;padding:0 0 4px}
}
@media (max-width:640px){
  .hero .logo,.hero .rainbow,.hero .sub{display:none}
  .hero{padding:18px 16px;gap:10px}
  .top-r{width:100%}
  .flab{width:100%;padding:2px 6px}
}
.bk-panel .icon-btn{width:32px;height:32px;border-radius:8px}
.bk-panel .bk-row{gap:6px;padding:8px}
.bk-panel .nm{font-size:14px;line-height:1.4}
.basket-bar .basket-in{flex-wrap:nowrap}

.bk-item{display:inline-flex;align-items:center;gap:6px;padding:4px 4px 4px 6px;border-radius:999px;background:var(--bg);border:1px solid var(--line);white-space:nowrap;flex:none}

/* 거래처 제안서 모드 위쪽 버튼 */

.cl-ctrls .knob::after{content:"";position:absolute;left:2px;top:2px;width:14px;height:14px;border-radius:7px;background:#FFFFFF;transition:left .15s}
.cl-ctrls .sw-on{border-color:var(--navy)}.cl-ctrls .sw-on .knob{background:var(--navy)}.cl-ctrls .sw-on .knob::after{left:16px}
.clinic>.wrap>.steps:first-child{padding-top:24px}
@media (max-width:640px){.cl-ctrls{order:2;width:100%}.cl-ctrls .btn{flex:1;padding:0 8px;font-size:14px}}

/* 가는 곳 묶음은 연한 하늘색, 버튼도 조금 크게 */
.fgroup.place{background:#E6EEF9}
.fgroup.place .tab{min-height:50px;padding:0 22px;font-size:17px;font-weight:700}
.fgroup:not(.place){background:#EEF0F4}
/* 아래 제안 바구니: 제목과 '제안하러 가기'는 붉은 포인트 */
.bk-line .bk-title{color:#C2410C;font-size:14px}
.bk-line .bk-cnt{background:#C2410C}
.go-link{display:inline-flex;align-items:center;gap:4px;min-height:40px;padding:0 6px;border:0;background:transparent;color:#C2410C;font-size:15px;font-weight:700;white-space:nowrap}
.go-link:hover{text-decoration:underline}
.go-link svg{width:16px;height:16px}
.cl-hint{margin:0 0 48px;padding:14px 16px;border-radius:12px;background:var(--bg);color:var(--muted);font-size:14px}
/* 제안 화면: 책장 넘기듯 열림 */
.page-turn{flex:1;display:flex;flex-direction:column;min-height:0;background:var(--bg);transform-origin:left center}
.page-turn.from-r{transform-origin:right center}
.page-turn.anim.from-l{animation:turnL .6s cubic-bezier(.2,.7,.2,1) both}
.page-turn.anim.from-r{animation:turnR .6s cubic-bezier(.2,.7,.2,1) both}
@keyframes turnL{from{transform:perspective(2200px) rotateY(-70deg);opacity:0}50%{opacity:1}to{transform:none;opacity:1}}
@keyframes turnR{from{transform:perspective(2200px) rotateY(70deg);opacity:0}50%{opacity:1}to{transform:none;opacity:1}}
.present{perspective:2200px}
.present>.wrap{width:100%}

.title-row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.pr-list{display:flex;flex-direction:column;gap:6px;max-height:50vh;overflow:auto}
.pr-row{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--bg);cursor:pointer}
.pr-row input{width:18px;height:18px;accent-color:var(--navy)}
.pr-row .num{width:24px;height:24px;border-radius:12px;background:var(--navy);color:#FFFFFF;font-size:12px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;flex:none}
.pr-row .nm{font-weight:500;min-width:0}
.pr-row.off{opacity:.55;cursor:not-allowed}

/* 관리자: 두 영역 */
.areas{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.area{display:flex;flex-direction:column;gap:6px;text-align:left;padding:18px 20px;border-radius:16px;border:1px solid var(--line);background:var(--surface);color:var(--muted);font-size:14px;line-height:1.5}
.area b{font-size:18px;color:var(--ink)}
.area:hover{border-color:var(--line-2)}
.area.on{border-color:var(--navy);box-shadow:0 0 0 1px var(--navy);background:var(--navy-soft)}
.area.on b{color:var(--navy)}
.subtabs .bk-cnt{min-width:20px;height:20px;font-size:11px;padding:0 6px;margin-left:4px}
@media (max-width:640px){.areas{grid-template-columns:minmax(0,1fr)}}

/* 관리자 페이지 (시안) */
.adm-band{background-color:var(--surface);background-image:radial-gradient(circle at 95% 0%,rgba(227,226,255,.9),transparent 42%),radial-gradient(circle at 78% 140%,rgba(255,226,240,.9),transparent 48%),radial-gradient(circle at 0% 120%,rgba(203,232,255,.8),transparent 40%);border:1px solid var(--line);border-radius:20px;padding:22px 26px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.adm-band h1{margin:0;font-size:24px;font-weight:900;color:var(--navy)}
.adm-band .sub2{font-size:14px;color:var(--muted);margin-top:2px}
.seg{display:inline-flex;padding:4px;border-radius:14px;background:rgba(238,242,248,.9);gap:4px}
.seg button{min-height:42px;padding:0 20px;border-radius:10px;border:0;background:transparent;font-size:15px;font-weight:700;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--navy);box-shadow:0 2px 6px rgba(46,74,120,.12)}
.chiprow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{min-height:36px;padding:0 14px;border-radius:18px;border:1px solid var(--line-2);background:var(--surface);display:inline-flex;align-items:center;font-size:14px;color:var(--navy)}
.chip.on{background:var(--navy);color:#FFFFFF;border-color:var(--navy)}
.dir{background:var(--navy);color:#FFFFFF;border-radius:16px;padding:18px 22px;font-size:16px;display:flex;gap:12px;align-items:center}
.dir b{font-size:13px;background:rgba(255,255,255,.18);border-radius:6px;padding:3px 8px;flex:none}
.k3{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:14px}
.kc{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px 22px;display:flex;flex-direction:column;gap:8px}
.kc .lab{font-size:14px;color:var(--muted);display:flex;align-items:center;gap:6px;font-weight:700}
.kc .big{font-size:36px;font-weight:900;color:var(--navy);font-variant-numeric:tabular-nums;line-height:1.1}
.kc .big small{font-size:16px;color:var(--sub);font-weight:500;margin-left:6px}
.prog{height:10px;border-radius:5px;background:var(--navy-soft);overflow:hidden}.prog i{display:block;height:100%;background:var(--navy);border-radius:5px}
.gold{color:#B8935A}.red{color:#C2410C}
.rank{display:flex;flex-direction:column;gap:10px}
.ri{display:grid;grid-template-columns:44px minmax(0,1fr) minmax(160px,260px);gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 18px}
.ri .no{width:36px;height:36px;border-radius:18px;background:var(--navy-soft);color:var(--navy);font-weight:900;display:flex;align-items:center;justify-content:center}
.ri.top .no{background:var(--navy);color:#FFFFFF}
.ri .nm{font-weight:700;font-size:16px}.ri .kd{font-size:13px;color:var(--sub);margin-top:2px}
.bars{display:flex;flex-direction:column;gap:6px;font-size:13px}
.bar2{display:grid;grid-template-columns:18px 1fr 30px;gap:8px;align-items:center}
.bar2 svg{width:14px;height:14px}
.bar2 .t{height:8px;border-radius:4px;background:#F1F2F5;overflow:hidden}.bar2 .t i{display:block;height:100%;border-radius:4px}
.bar2 .v{text-align:right;font-variant-numeric:tabular-nums}
.ins{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.ic{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--muted);text-align:left}
.ic h3{margin:0;font-size:15px;color:var(--ink);display:flex;justify-content:space-between}
.ic h3 span{font-size:13px;color:var(--sub);font-weight:500}
.ic small{font-size:13px;color:var(--sub)}
button.ic:hover{border-color:var(--navy)}
.vis-sw{display:inline-flex;align-items:center;gap:8px;align-self:flex-start;min-height:36px;padding:0;border:0;background:transparent;color:var(--muted);font-size:13px}
.vis-sw .knob{width:32px;height:18px;border-radius:9px;background:var(--line-2);position:relative;flex:none}
.vis-sw .knob::after{content:"";position:absolute;left:2px;top:2px;width:14px;height:14px;border-radius:7px;background:#FFFFFF;transition:left .15s}
.vis-sw.on{color:var(--navy)}.vis-sw.on .knob{background:var(--navy)}.vis-sw.on .knob::after{left:16px}
.kan{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;align-items:start}
.kcol{background:#EEF0F4;border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:8px}
.kcol h3{margin:0 4px 4px;font-size:15px;display:flex;justify-content:space-between}
.rq{background:var(--surface);border-radius:12px;padding:12px;font-size:14px;border:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.rq .m{font-size:12px;color:var(--sub)}
.rq-acts{display:flex;justify-content:space-between;gap:6px}
.mini-btn{min-height:32px;padding:0 10px;border-radius:8px;border:1px solid var(--line-2);background:var(--surface);color:var(--muted);font-size:12px;font-weight:700}
.mini-btn.on{background:var(--navy);border-color:var(--navy);color:#FFFFFF}
@media (max-width:900px){.k3{grid-template-columns:minmax(0,1fr)}.ins{grid-template-columns:repeat(2,minmax(0,1fr))}.kan{grid-template-columns:minmax(0,1fr)}}
@media (max-width:640px){.ins{grid-template-columns:minmax(0,1fr)}.ri{grid-template-columns:36px minmax(0,1fr)}.ri .bars{grid-column:1/-1}}
/* 제안 화면 왼쪽 번호 레일 */
.pv{flex:1;display:flex;min-height:0}
.rail{width:220px;flex:none;overflow-y:auto;padding:18px 0 18px 18px;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;scroll-snap-type:y proximity}
.rail-i{position:relative;display:flex;align-items:center;gap:10px;min-height:56px;padding:6px 12px 6px 0;border:0;background:transparent;text-align:left;color:var(--muted);scroll-snap-align:start}
.rail-i::before{content:"";position:absolute;left:17px;top:0;bottom:0;border-left:2px dashed var(--line-2)}
.rail-i:first-child::before{top:50%}.rail-i:last-child::before{bottom:50%}
.rail-i .rn{position:relative;z-index:1;width:36px;height:36px;border-radius:18px;background:var(--surface);border:2px solid var(--line-2);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:15px;flex:none}
.rail-i .rl{font-size:14px;font-weight:500;line-height:1.35;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.rail-i:hover .rn{border-color:var(--navy)}
.rail-i.on{color:var(--ink)}.rail-i.on .rn{background:var(--navy);border-color:var(--navy);color:#FFFFFF}.rail-i.on .rl{font-weight:700}
@media (max-width:640px){
  .pv{flex-direction:column}
  .rail{width:auto;flex-direction:row;overflow-x:auto;overflow-y:hidden;padding:8px 12px;border-right:0;border-bottom:1px solid var(--line);scroll-snap-type:x proximity}
  .rail-i{min-height:44px;padding:0 14px 0 0}
  .rail-i::before{left:0;right:0;top:50%;bottom:auto;border-left:0;border-top:2px dashed var(--line-2)}
  .rail-i:first-child::before{left:18px;top:50%}.rail-i:last-child::before{right:auto;width:18px;bottom:auto}
  .rail-i .rl{display:none}
  .rail-i.on .rl{display:-webkit-box;max-width:140px}
}

/* 이달의 주요 이슈 */
.issue-chip{display:inline-flex;align-items:center;gap:8px;min-height:62px;padding:0 22px;border-radius:16px;border:1.5px dashed #F2B48A;background:#FFF4EC;color:#C2410C;font-size:17px;font-weight:700}
.issue-chip .n{font-size:13px;opacity:.7}
.issue-chip:hover{border-style:solid}
.issue-chip.on{background:#C2410C;border:1.5px solid #C2410C;color:#FFFFFF}
.tag.a-issue{background:#FFF4EC;color:#C2410C}
@media (max-width:640px){.issue-chip{min-height:48px;width:100%;justify-content:center}}

.k-web{background:#E8EDFF;color:#2B44A8}.k-url{background:#E1F5EC;color:#0B6B50}.k-pdf{background:#FDEBDF;color:#A8401A}.k-img{background:#F8E6EE;color:#9A2C5B}
.tab .tw{display:inline-flex;flex-direction:column;line-height:1.15;text-align:left}
.tab .tw small{font-size:11px;font-weight:500;opacity:.75}

/* 이달의 주요 이슈: 목록 맨 위 한 줄 띠 (위쪽 줄 아래에 붙어 따라옴) */
.issue-strip{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--hh,76px));z-index:15;display:flex;align-items:center;gap:12px;min-height:52px;padding:6px 10px 6px 14px;border-radius:14px;border:1.5px solid #F2B48A;background:#FFF4EC;box-shadow:0 6px 14px rgba(194,65,12,.08)}
.is-lab{display:inline-flex;align-items:center;gap:6px;color:#C2410C;font-weight:700;font-size:14px;white-space:nowrap;flex:none}
.is-items{display:flex;gap:8px;overflow-x:auto;min-width:0;flex:1;scrollbar-width:thin}
.is-item{display:inline-flex;align-items:center;gap:6px;padding:4px 4px 4px 12px;border-radius:999px;background:var(--surface);border:1px solid #F6D3BC;white-space:nowrap;flex:none}
.is-nm{font-size:14px;font-weight:700;color:var(--ink)}
.is-btn{min-height:30px;padding:0 10px;border-radius:15px;border:1px solid var(--line-2);background:var(--surface);color:var(--navy);font-size:12px;font-weight:700}
.is-btn.on{background:var(--gold);border-color:var(--gold);color:#FFFFFF}
@media (max-width:640px){.issue-strip{flex-wrap:nowrap}.is-lab{font-size:0;gap:0}.is-lab svg{width:18px;height:18px}}

/* 카드: 마우스를 올리면 살짝 떠오름 */
.card{transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease}
.card:hover{transform:translateY(-4px);box-shadow:0 14px 28px rgba(31,42,68,.12);border-color:var(--line-2)}
.card h3{margin-top:2px}
/* 내부용: 담기 버튼과 같은 크기의 점선 상자 */
.btn-no{flex:1;border:1.5px dashed var(--line-2);background:transparent;color:#8C97AD;cursor:not-allowed;font-weight:700}
.btn-no svg{width:14px;height:14px}

/* 이달의 주요 이슈 v2: 바깥 상자 없이, 자료마다 연한 빨강 반투명 상자 */
.issue-strip{border:0;box-shadow:none;background:var(--bg);border-radius:0;padding:8px 0;min-height:0;gap:14px}
.is-item{gap:10px;padding:8px 8px 8px 16px;border-radius:14px;background:rgba(194,65,12,.07);border:1px solid rgba(194,65,12,.28)}
.is-nm{font-size:15px;color:#9A3412}
.is-btn{min-height:34px;padding:0 12px;border-radius:10px;font-size:13px;display:inline-flex;align-items:center;gap:4px}
.is-btn svg{width:14px;height:14px}
.is-btn.go{background:var(--navy);border-color:var(--navy);color:#FFFFFF}
.is-btn.on{background:var(--gold);border-color:var(--gold);color:#FFFFFF}
.present-ph.blocked{border-style:solid;border-color:var(--line);gap:14px;padding:44px 32px}

/* 이달의 주요 이슈 v3: 분홍·빨강 계열, 제목은 꽉 찬 배지로 눈에 띄게 */
.is-lab{background:#E11D48;color:#FFFFFF;padding:7px 14px;border-radius:999px;font-size:14px;box-shadow:0 4px 10px rgba(225,29,72,.25)}
.is-lab svg{color:#FFFFFF}
.is-item{background:#FFF1F4;border:1px solid #FBCFDA;padding:6px 6px 6px 14px;border-radius:999px;gap:8px}
.is-nm{color:#BE123C}
.is-btn{border-radius:999px;min-height:32px;padding:0 14px;border:1px solid #FBCFDA;background:#FFFFFF;color:#BE123C}
.is-btn.go{background:#E11D48;border-color:#E11D48;color:#FFFFFF}
.is-btn.on{background:#BE123C;border-color:#BE123C;color:#FFFFFF}
@media (max-width:640px){.is-lab{font-size:0;padding:8px}.is-lab svg{width:16px;height:16px}}
/* 이달의 주요 이슈 v4: 맑은 블루 */
.is-lab{background:#E2EEFF;color:#2F6FCB;box-shadow:none}.is-lab svg{color:#5B9BF0}
.is-item{background:#FFFFFF;border-color:#D3E3FB}.is-nm{color:#24539A}
.is-btn{border-color:#D3E3FB;color:#2F6FCB}
.is-btn.go{background:#5B9BF0;border-color:#5B9BF0;color:#FFFFFF}
.is-btn.on{background:#2F6FCB;border-color:#2F6FCB;color:#FFFFFF}
/* 빈 바구니: 오른쪽 아래 작은 알약 → 담으면 바로 펼쳐짐 */
.bk-pill{position:fixed;right:24px;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:30;display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:999px;background:rgba(255,255,255,.92);border:1px dashed #E7B9A6;color:#9A5A44;font-size:13px;box-shadow:0 6px 18px rgba(31,42,68,.08);backdrop-filter:blur(6px);pointer-events:none}
.bk-pill svg{width:16px;height:16px;color:#C2410C}
.bk-pill b{color:#C2410C;font-weight:700}
.bk-pill span{color:#8A7A72}
.basket-bar.open{animation:bkOpen .35s cubic-bezier(.2,.8,.2,1)}
@keyframes bkOpen{from{transform:translateY(100%);opacity:0}to{transform:none;opacity:1}}
.bk-cnt.pop{animation:bkPop .4s ease}
@keyframes bkPop{0%{transform:scale(1)}40%{transform:scale(1.35)}100%{transform:scale(1)}}
@media (max-width:640px){.bk-pill span{display:none}.bk-pill{right:16px}}
@media (prefers-reduced-motion:reduce){.basket-bar.open,.bk-cnt.pop{animation:none}}
/* 관리자 모드 버튼: 연한 앰버 알약 + 열쇠 */
.adm-btn{display:inline-flex;align-items:center;gap:6px;min-height:38px;padding:0 14px;border-radius:999px;border:1px solid #F2D48A;background:#FFF5DA;color:#8A5A00;font-size:14px;font-weight:700;cursor:pointer}
.adm-btn:hover{background:#FFEDBF}
.adm-btn.on{background:#FFD978;border-color:#F2C14E;color:#5C3D00}
/* 관리자: 보는 단위 2단(사업부 → 사무소) */
.scope{display:flex;flex-direction:column;gap:8px}
.scope .lb{min-width:72px;font-size:14px;font-weight:700;color:var(--muted)}
.scope .sp{flex:1}
.sub-scope{padding:8px 12px;border-radius:12px;background:#EEF3FB}
.sub-scope .chip{min-height:34px}
/* 관리자: 자료 관리 한 줄 목록 */
.mrows{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.mrow{display:flex;align-items:center;gap:14px;padding:12px 18px}
.mrow+.mrow{border-top:1px solid var(--line)}

/* 이달의 주요 이슈: 이름에 연한 분홍 형광펜 */

.chiprow.per{margin-bottom:8px}.chiprow.per .lb,.scope .lb{min-width:72px;font-size:14px;font-weight:700;color:var(--muted)}
/* 사용 추이 그래프 */
.trend{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 18px}
.tr-h{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.tr-h .muted{font-size:13px;flex:1}
.tr-lg{display:flex;gap:14px;font-size:13px;font-weight:700;color:var(--ink)}
.tr-lg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}

.tr-svg .ax{font-size:12px;fill:#8A97AB}

/* 카드 높이 줄이기: 제목 1줄, 설명 2줄까지 (전체는 마우스 올리면 보임) */
.grid .card h3{display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.grid .card p{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.grid .card .cthumb{height:96px}
/* 카드: 마우스 올리면 확실히 떠오르게 + 잘린 글은 펼쳐 보기 */
.card{position:relative}
.card:hover{transform:translateY(-6px);box-shadow:0 18px 36px rgba(31,42,68,.16),0 2px 0 #5B9BF0 inset;border-color:#BFD3F2}

.card .full{display:none;position:absolute;left:-8px;right:-8px;top:-8px;z-index:6;background:#FFFFFF;border:1px solid #BFD3F2;border-radius:12px;padding:12px 14px;box-shadow:0 12px 28px rgba(31,42,68,.18);font-size:14px;line-height:1.55;color:var(--muted)}

/* 카드 호버: 색 없이 후광만 */
.card:hover{box-shadow:0 -10px 24px -6px rgba(46,74,120,.22),0 18px 36px rgba(31,42,68,.12);border-color:var(--line)}
/* 보기 전환 */
.vsw{display:inline-flex;gap:2px;padding:3px;border-radius:10px;background:#E9EDF3;margin-left:auto;margin-right:14px}
.vsw button{width:32px;height:28px;border:0;border-radius:8px;background:none;color:#8A97AB;display:flex;align-items:center;justify-content:center;cursor:pointer}
.vsw button.on{background:#FFFFFF;color:var(--navy);box-shadow:0 1px 3px rgba(31,42,68,.12)}
/* 한 줄형 */
.lrows{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.lr{display:flex;align-items:center;gap:12px;padding:10px 16px;transition:background .15s,box-shadow .15s}
.lr+.lr{border-top:1px solid var(--line)}
.lr:hover{background:#F8FAFD;box-shadow:inset 3px 0 0 #C9D3E3}
.lr>.tag{flex:none;min-width:58px;text-align:center}
.lr-th{flex:none;width:40px;height:56px;padding:0;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:#F7F9FC;cursor:zoom-in}
.lr-th img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
.lr-main{flex:1;min-width:0;display:flex;align-items:center;gap:8px;overflow:hidden}

.lr .tag.a-issue{flex:none}

@media (max-width:760px){.lr{flex-wrap:wrap}.lr-main{flex-basis:100%;order:3}.lr-ds{display:none}}

<body>
<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
(function(){
"use strict";

/* =====================================================================
   연결 설정: Supabase의 Project URL과 Publishable key를 넣으세요.
   비워두면 저장되지 않는 미리보기 모드로 돌아갑니다.
   ===================================================================== */
var SUPABASE_URL = 'https://ahyeaqwdwawnxfssokuv.supabase.co';
var SUPABASE_KEY = 'sb_publishable_OUtfwHh2ROmroJP-YrBh0Q_JZZFfQtg';

var LIVE = !!(SUPABASE_URL && SUPABASE_KEY && window.supabase);
var EMAIL_DOMAIN = '@daisso.internal';

/* ---------- 고정 분류 ---------- */
var PLACES=[{id:'new',label:'신규처 제안',c:'#C77D9B'},{id:'keep',label:'거래처 관리',c:'#4C9F86'},{id:'ref',label:'업무참고',c:'#8D72C9'}];
var KINDS=[{id:'tool',label:'툴',c:'#5C7FC4'},{id:'brochure',label:'브로셔',c:'#E0A15E'},{id:'rp',label:'표준RP',c:'#C77D9B'},{id:'site',label:'참고 사이트',c:'#4FA3B8'},{id:'notice',label:'교육·공문',c:'#6BA37E'}];
var KLBL={};KINDS.forEach(function(k){KLBL[k.id]=k.label;});
var NEEDS=[{id:'all',label:'전체',c:'#8C99B3'}].concat(KINDS).concat([{id:'contact',label:'문의처',c:'#8D72C9',phone:true}]);
/* MR은 사번만으로 로그인: 내부 비밀번호를 사번에서 만들어 씀. 관리자는 따로 비밀번호를 둠 */
function normEmp(v){v=String(v||'').trim();var d=v.replace(/\D/g,'');return (d.length>7&&d===v.replace(/[\s-]/g,''))?d.slice(-7):v;}
function mrPw(emp){return 'daisso-'+String(emp||'').trim().toLowerCase();}
var KIND={tool:'웹툴',site:'URL',brochure:'브로셔',notice:'공문',edu:'교육자료'};
/* 자료 형태는 따로 고르지 않고 정해짐: 파일이면 PDF·이미지, 주소면 웹툴(tool)·URL(그 밖) */
var FMT={web:'웹툴',url:'URL',pdf:'PDF',img:'이미지'};
function isHtml(f){return /\.html?$/i.test(f||'');}
function fmt(t){if(t.file)return /\.pdf$/i.test(t.file)?'pdf':isHtml(t.file)?'web':'img';return t.kind==='tool'||t.kind==='brochure'?'web':'url';}
var STAGES=[{id:'s1',label:'초기 제안',no:'1단계'},{id:'s2',label:'기초 셋팅',no:'2단계'},{id:'s3',label:'일만사 시작·청구',no:'3단계'}];
var REQ_STATUS=['접수','만드는 중','올림'];

/* =====================================================================
   데이터 창구: 운영(Supabase) / 미리보기(메모리) 두 가지가 같은 모양
   ===================================================================== */
/* 교육자료는 DB의 종류 목록을 바꾸지 않으려고 kind='notice' + places에 '_edu'로 저장합니다 */
var EDU_TAG='_edu';
function toTool(r){var pl=r.places||[],edu=pl.indexOf(EDU_TAG)>=0,tg=pl.filter(function(x){return x!==EDU_TAG;});if(edu&&tg.indexOf('ref')<0)tg.push('ref');return {id:r.id,name:r.name,kind:edu?'notice':r.kind,tags:tg,month:!!r.is_month,doctor:!!r.for_doctor,url:r.url||'',file:r.file_path||'',desc:r.description||'',pub:r.doctor_desc||'',by:r.made_by||'',sort:r.sort||0,active:r.active!==false};}
function fromTool(t){var edu=t.kind==='edu';return {name:t.name,kind:edu?'notice':t.kind,places:edu?t.tags.concat([EDU_TAG]):t.tags,is_month:t.month,for_doctor:t.doctor,url:t.url||null,file_path:t.file||null,description:t.desc,doctor_desc:t.pub,made_by:t.by,sort:t.sort||0,active:t.active!==false,updated_at:new Date().toISOString()};}
function toScript(r){return {id:r.id,stage:r.stage,type:r.type,title:r.title,text:r.body||'',tool:r.tool_id||null,sort:r.sort||0};}
function toContact(r){return {id:r.id,topic:r.topic,dept:r.dept||'',tel:r.tel||'',tags:r.places||[],sort:r.sort||0};}
function must(res){if(res.error)throw res.error;return res.data;}

var live={
  sb:null,
  init:function(){
    var store={
      getItem:function(k){try{return sessionStorage.getItem(k)||localStorage.getItem(k);}catch(e){return null;}},
      setItem:function(k,v){try{(live.keep?localStorage:sessionStorage).setItem(k,v);}catch(e){}},
      removeItem:function(k){try{localStorage.removeItem(k);sessionStorage.removeItem(k);}catch(e){}}
    };
    try{live.keep=localStorage.getItem('daisso_keep')==='1';}catch(e){live.keep=false;}
    live.sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{storage:store,persistSession:true,autoRefreshToken:true}});
  },
  session:async function(){var r=await live.sb.auth.getSession();return r.data.session?r.data.session.user.id:null;},
  signIn:async function(emp,pw,keep){
    live.keep=!!keep;try{localStorage.setItem('daisso_keep',keep?'1':'0');}catch(e){}
    var r=await live.sb.auth.signInWithPassword({email:emp.trim().toLowerCase()+EMAIL_DOMAIN,password:pw});
    if(r.error){var bad=r.error.status===400||/invalid/i.test(r.error.message||'');var er=new Error(bad?'bad':'down');er.code=bad?'bad':'down';throw er;}
    return r.data.user.id;
  },
  signOut:async function(){await live.sb.auth.signOut();},
  profile:async function(uid){return must(await live.sb.from('profiles').select('*').eq('id',uid).single());},
  loadAll:async function(){
    var r=await Promise.all([
      live.sb.from('tools').select('*').order('sort').order('created_at'),
      live.sb.from('scripts').select('*').order('stage').order('sort'),
      live.sb.from('contacts').select('*').order('sort'),
      live.sb.from('favorites').select('tool_id')
    ]);
    return {tools:must(r[0]).map(toTool),scripts:must(r[1]).map(toScript),contacts:must(r[2]).map(toContact),favs:must(r[3]).map(function(x){return x.tool_id;})};
  },
  setFav:async function(id,on){if(on)must(await live.sb.from('favorites').insert({tool_id:id}));else must(await live.sb.from('favorites').delete().eq('tool_id',id));},
  track:function(type,target){live.sb.from('events').insert({type:type,target:target||null}).then(function(){});},
  sendRequest:async function(body,place){must(await live.sb.from('requests').insert({body:body,place:place}));},
  fileUrl:async function(path){var r=must(await live.sb.storage.from('files').createSignedUrl(path,3600));return r.signedUrl;},
  saveTool:async function(id,t,file){
    if(file){var path=Date.now()+'-'+file.name.replace(/[^\w.\-]+/g,'_');must(await live.sb.storage.from('files').upload(path,file,{upsert:false}));t.file=path;t.url='';}
    var row=fromTool(t);
    if(id)return toTool(must(await live.sb.from('tools').update(row).eq('id',id).select().single()));
    return toTool(must(await live.sb.from('tools').insert(row).select().single()));
  },
  deleteTool:async function(id){must(await live.sb.from('tools').delete().eq('id',id));},
  saveScript:async function(id,m){var row={stage:m.stage,type:m.type,title:m.title,body:m.text,tool_id:m.tool||null,sort:m.sort||0};
    if(id)return toScript(must(await live.sb.from('scripts').update(row).eq('id',id).select().single()));
    return toScript(must(await live.sb.from('scripts').insert(row).select().single()));},
  deleteScript:async function(id){must(await live.sb.from('scripts').delete().eq('id',id));},
  saveContact:async function(id,c){var row={topic:c.topic,dept:c.dept,tel:c.tel,places:c.tags,sort:c.sort||0};
    if(id)return toContact(must(await live.sb.from('contacts').update(row).eq('id',id).select().single()));
    return toContact(must(await live.sb.from('contacts').insert(row).select().single()));},
  deleteContact:async function(id){must(await live.sb.from('contacts').delete().eq('id',id));},
  daily:async function(from){var r=await live.sb.rpc('admin_daily',{p_from:from||null});if(r.error)return null;return r.data;},
  stats:async function(from){return must(await live.sb.rpc('admin_stats',{p_from:from||null}));},
  requests:async function(){return must(await live.sb.from('requests').select('id,body,place,status,office,division,created_at').order('created_at',{ascending:false}));},
  setReqStatus:async function(id,s){must(await live.sb.from('requests').update({status:s}).eq('id',id));},
  members:async function(){return must(await live.sb.from('profiles').select('emp_no,name,division,office,role').order('office').order('name'));},
  upsertMember:async function(m){must(await live.sb.rpc('admin_upsert_member',{p_emp_no:m.emp_no,p_name:m.name,p_division:m.division,p_office:m.office,p_role:m.role,p_password:m.password||null}));},
  deleteMember:async function(emp){must(await live.sb.rpc('admin_delete_member',{p_emp_no:emp}));},
  changePassword:async function(pw){var r=await live.sb.auth.updateUser({password:pw});if(r.error)throw r.error;}
};

var app=document.getElementById('app');
function render(){
  var a=document.activeElement,fid=a&&a.id,sel=null;
  try{sel=fid&&a.selectionStart!=null?[a.selectionStart,a.selectionEnd]:null;}catch(e){}
  var h;
  if(S.boot){h='<div class="login wrap"><div class="muted">불러오는 중…</div></div>';}
  else if(!S.uid){h=vLogin();}
  else{
    h=vHeader();
    if(S.mode==='clinic')h+=vClinic();
    else if(S.page==='admin'&&isAdmin())h+=vAdmin();
    else h+=vTools();
  }
  if(S.uid||!S.boot)h+=vModal();
  if(S.zoom)h+='<div class="zoom-ov" data-act="zoomClose" role="dialog" aria-label="크게 보기"><img src="'+esc(S.zoom)+'" alt=""><span class="zx">닫기 ✕</span></div>';
  if(S.toast)h+='<div class="toast" role="status">'+esc(S.toast)+'</div>';
  if(S.modal){var keep={};[].forEach.call(document.querySelectorAll('.modal input,.modal textarea,.modal select'),function(el){if(el.id&&el.type!=='file'&&el.type!=='checkbox')keep[el.id]=el.value;});}
  app.innerHTML=h;
  var hd=app.querySelector('header.top');document.documentElement.style.setProperty('--hh',(hd?hd.offsetHeight:0)+'px');
  if(S.modal&&keep){Object.keys(keep).forEach(function(id){var el=document.getElementById(id);if(el)el.value=keep[id];});}
  if(fid){var el=document.getElementById(fid);if(el){el.focus();if(sel){try{el.setSelectionRange(sel[0],sel[1]);}catch(e){}}}}
}

async function afterLogin(uid){

  S.me=await api.profile(uid);

  S.tools=d.tools;S.scripts=d.scripts;S.contacts=d.contacts;
  S.favs={};d.favs.forEach(function(id){S.favs[id]=true;});
  try{var b=JSON.parse(sessionStorage.getItem('daisso_basket')||'[]');S.basket=b.filter(function(id){var t=byId(id);return t&&t.doctor;});}catch(e){}
  S.mode='prep';S.page='tools';
}
function saveBasket(){try{sessionStorage.setItem('daisso_basket',JSON.stringify(S.basket));}catch(e){}}
async function loadAdmin(){
  try{
    if((S.adminArea||'stats')==='stats'){var r=await Promise.all([api.stats(periodFrom()),api.requests(),api.members(),api.daily?api.daily(periodFrom()).catch(function(){return null;}):null]);S.stats=r[0];S.reqs=r[1];S.members=r[2];S.daily=r[3];}
    else{var r2=await Promise.all([api.requests(),api.members()]);S.reqs=r2[0];S.members=r2[1];}
  }catch(e){fail(e);}

async function openTool(t,inPlace){
  track(inPlace?'present':'open',t.id);
  if(!LIVE){if(!inPlace)say('미리보기 모드라 실제 툴은 열리지 않아요. 운영 버전에서는 새 탭에 툴만 열립니다.');return null;}
  if(t.url)return t.url;
  if(t.file&&isHtml(t.file))return await htmlView(t);
  if(t.file)return await api.fileUrl(t.file);
  if(!inPlace)say('아직 주소나 파일이 등록되지 않은 자료예요.');
  return null;
}
/* 올린 HTML 툴은 격리된 틀(sandbox) 안에서만 실행: 다있소 로그인 정보에 접근하지 못하게 */
var htmlCache={};
async function htmlView(t){
  if(htmlCache[t.file])return htmlCache[t.file];
  var src=await (await fetch(await api.fileUrl(t.file))).text();
  var page='<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>'+esc(t.name)+'</title><style>html,body{margin:0;height:100%}iframe{border:0;width:100%;height:100%;display:block}</style></head><body><iframe sandbox="allow-scripts allow-modals allow-popups allow-forms allow-downloads" srcdoc="'+esc(src)+'"></iframe></body></html>';
  return htmlCache[t.file]=URL.createObjectURL(new Blob([page],{type:'text/html'}));
}
/* 사이트가 다른 화면 안에서 열리는 걸 막았는지 확인 (결과는 기억해 둠) */
var frameOk={};
async function canFrame(url){
  if(!/^https?:/i.test(url)||url.indexOf(SUPABASE_URL)===0)return true;
  if(frameOk[url]!==undefined)return frameOk[url];
  try{var r=await fetch('/api/framecheck?url='+encodeURIComponent(url));var j=await r.json();frameOk[url]=j.embeddable!==false;}catch(e){frameOk[url]=true;}
  return frameOk[url];
}
async function showPresent(i){
  var t=clinicList()[i];if(!t)return;
  S.present=i;S.presentUrl='';S.presentBlocked=false;S.presentLoading=true;S.flipAnim=true;render();S.flipAnim=false;
  try{var u=(await openTool(t,true))||'';if(u&&!t.file&&!(await canFrame(u)))S.presentBlocked=true;S.presentUrl=u;}catch(e){fail(e);}
  S.presentLoading=false;render();
}

document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]');if(!el)return;
  var act=el.getAttribute('data-act'),v=el.getAttribute('data-v');
  if(act==='closeModal'&&e.target!==el)return;
  switch(act){
    case 'mode':S.mode=v;S.present=-1;S.basketOpen=false;window.scrollTo(0,0);break;
    case 'page':S.page=v;window.scrollTo(0,0);if(v==='admin')loadAdmin();break;
    case 'home':S.mode='prep';S.page='tools';S.present=-1;window.scrollTo(0,0);break;
    case 'logout':api.signOut();S.uid=null;S.me=null;S.basket=[];saveBasket();S.mode='prep';S.page='tools';S.stats=S.reqs=S.members=null;break;
    case 'pwModal':S.modal='pw';break;
    case 'place':S.place=v;S.favOnly=false;break;
    case 'need':S.need=v;S.favOnly=false;break;
    case 'favOnly':S.favOnly=!S.favOnly;break;
    case 'fav':
      var on=!S.favs[v];if(on)S.favs[v]=true;else delete S.favs[v];track(on?'fav':'unfav',v);
      api.setFav(v,on).catch(function(err){if(on)delete S.favs[v];else S.favs[v]=true;fail(err);});break;
    case 'zoom':var zt=byId(v);if(zt&&THUMB[zt.file]){S.zoom=THUMB[zt.file];track('open',v);}break;
    case 'zoomClose':S.zoom='';break;
    case 'open':
      var t=byId(v);if(!t)break;
      var win=LIVE&&(t.url||t.file)?window.open('about:blank','_blank'):null;
      openTool(t,false).then(function(url){if(url&&win){win.opener=null;win.location.href=url;}else if(win){win.close();}}).catch(function(err){if(win)win.close();fail(err);});
      break;
    case 'basket':var i=S.basket.indexOf(v);if(i>=0){S.basket.splice(i,1);}else{S.basket.push(v);track('basket',v);}if(!S.basket.length)S.basketOpen=false;saveBasket();break;
    case 'basketOpen':S.basketOpen=!S.basketOpen;break;
    case 'basketClear':S.basket=[];S.basketOpen=false;saveBasket();say('제안서를 비웠어요.');break;
    case 'bkUp':case 'bkDown':var k=+v,j=act==='bkUp'?k-1:k+1;if(j>=0&&j<S.basket.length){var tmp=S.basket[k];S.basket[k]=S.basket[j];S.basket[j]=tmp;saveBasket();}break;
    case 'present':S.flip='next';showPresent(+v);return;
    case 'prev':if(S.present>0){S.flip='prev';showPresent(S.present-1);}return;
    case 'next':if(S.present<clinicList().length-1){S.flip='next';showPresent(S.present+1);}return;
    case 'jump':var jt=+v;if(jt!==S.present){S.flip=jt<S.present?'prev':'next';showPresent(jt);}return;
    case 'closePresent':S.present=-1;S.presentUrl='';break;
    case 'stage':S.stage=v;break;
    case 'simple':S.simple=!S.simple;break;
    case 'bkEdit':S.modal='bkEdit';break;
    case 'printOpen':S.printSel={};S.printUrl='';clinicList().forEach(function(t){if(isPrintable(t))S.printSel[t.id]=true;});S.modal='print';break;
    case 'printAll':var pa=clinicList().filter(isPrintable),allOn=pa.every(function(t){return S.printSel[t.id];});S.printSel={};if(!allOn)pa.forEach(function(t){S.printSel[t.id]=true;});break;
    case 'printGo':doPrint();return;
    case 'addMore':S.modal=null;S.mode='prep';S.page='tools';S.present=-1;window.scrollTo(0,0);say('자료를 더 담은 뒤 아래 "거래처 제안서 모드로"를 누르세요.');break;
    case 'endVisit':S.basket=[];saveBasket();S.hospital='';S.simple=false;S.present=-1;S.presentUrl='';S.mode='prep';S.basketOpen=false;window.scrollTo(0,0);say('제안서를 비웠어요. 다음 병원 준비하세요.');break;
    case 'copy':
      var m=S.scripts.filter(function(x){return x.id===v;})[0];if(!m)break;track('copy',v);
      var fallback=function(){var node=document.getElementById('sc-'+v);if(node){var r=document.createRange();r.selectNodeContents(node);var s=window.getSelection();s.removeAllRanges();s.addRange(r);}say('자동 복사가 막혀서 멘트를 선택해 뒀어요. 길게 눌러 복사하세요.');render();};
      try{navigator.clipboard.writeText(m.text).then(function(){say('멘트를 복사했어요. 문자나 카톡에 붙여넣으세요.');render();},fallback);}catch(err){fallback();}
      return;
    case 'openReq':S.modal='req';break;
    case 'closeModal':S.modal=null;S.edit=null;break;
    case 'adminTab':S.adminTab=v;loadAdmin();break;
    case 'scope':S.scope=v;break;
    case 'period':S.period=v;S.stats=null;loadAdmin();break;
    case 'view':S.view=v;try{localStorage.setItem('daisso_view',v);}catch(e){}break;
    case 'statFocus':S.statFocus=S.statFocus===v?'':v;break;
    case 'admKind':S.admKind=v;break;
    case 'goReqs':S.adminArea='manage';S.adminTab='reqs';loadAdmin();break;
    case 'toggleActive':var ta=byId(v);if(ta){var nd=Object.assign({},ta,{active:!ta.active});api.saveTool(ta.id,nd,null).then(function(sv){S.tools=S.tools.map(function(x){return x.id===sv.id?sv:x;});say(sv.active?'MR 화면에 다시 보여요.':'MR 화면에서 숨겼어요.');render();}).catch(fail);}return;
    case 'reqMove':var rp=v.split(':'),rid=rp[0],rst=rp.slice(1).join(':');api.setReqStatus(rid,rst).then(function(){(S.reqs||[]).forEach(function(r){if(r.id===rid)r.status=rst;});render();}).catch(fail);return;
    case 'adminArea':S.adminArea=v;if(v==='manage'&&['tools','contacts','users','reqs'].indexOf(S.adminTab)<0)S.adminTab='tools';loadAdmin();break;
    case 'reloadStats':S.stats=null;loadAdmin();break;
    case 'newTool':S.modal='tool';S.edit=null;break;
    case 'editTool':S.modal='tool';S.edit=v;break;
    case 'newScript':S.modal='script';S.edit=null;break;
    case 'editScript':S.modal='script';S.edit=v;break;
    case 'newContact':S.modal='contact';S.edit=null;break;
    case 'editContact':S.modal='contact';S.edit=v;break;
    case 'newUser':S.modal='user';S.edit=null;break;
    case 'editUser':S.modal='user';S.edit=v;break;
    case 'bulkUsers':S.modal='bulk';break;
    case 'delAsk':S.modal='del:'+v;break;
    case 'delYes':doDelete(v);return;
    default:return;
  }
  render();
});
/* 인쇄: PDF·이미지 자료를 한 PDF로 합쳐 인쇄 창을 엽니다 (pdf-lib는 처음 쓸 때만 불러옴) */
function isPrintable(t){return !!(t&&t.file&&/\.(pdf|png|jpe?g|webp|gif)$/i.test(t.file));}
function loadScript(src){return new Promise(function(ok,no){var el=document.createElement('script');el.src=src;el.onload=ok;el.onerror=function(){no(new Error('인쇄 도구를 불러오지 못했어요. 인터넷 연결을 확인해 주세요.'));};document.head.appendChild(el);});}
function imageToPng(bytes){return new Promise(function(ok,no){var url=URL.createObjectURL(new Blob([bytes]));var img=new Image();img.onload=function(){var c=document.createElement('canvas');c.width=img.naturalWidth;c.height=img.naturalHeight;c.getContext('2d').drawImage(img,0,0);URL.revokeObjectURL(url);c.toBlob(function(b){b.arrayBuffer().then(ok,no);},'image/png');};img.onerror=function(){no(new Error('이미지를 읽지 못했어요.'));};img.src=url;});}
async function doPrint(){
  var items=clinicList().filter(function(t){return isPrintable(t)&&S.printSel[t.id];});
  if(!items.length)return;
  S.busy=true;render();
  try{
    if(!window.PDFLib)await loadScript('https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js');
    var out=await PDFLib.PDFDocument.create();
    for(var i=0;i<items.length;i++){
      var t=items[i],url=await api.fileUrl(t.file);
      var bytes=await (await fetch(url)).arrayBuffer();
      if(/\.pdf$/i.test(t.file)){
        var src=await PDFLib.PDFDocument.load(bytes,{ignoreEncryption:true});
        (await out.copyPages(src,src.getPageIndices())).forEach(function(pg){out.addPage(pg);});
      }else{
        var png=await out.embedPng(await imageToPng(bytes));
        var W=595.28,H=841.89,m=28,sc=Math.min((W-2*m)/png.width,(H-2*m)/png.height,1);
        var page=out.addPage([W,H]);page.drawImage(png,{x:(W-png.width*sc)/2,y:(H-png.height*sc)/2,width:png.width*sc,height:png.height*sc});
      }
    }
    var blobUrl=URL.createObjectURL(new Blob([await out.save()],{type:'application/pdf'}));
    S.printUrl=blobUrl;
    var fr=document.getElementById('print-frame');if(fr)fr.remove();
    fr=document.createElement('iframe');fr.id='print-frame';fr.style.cssText='position:fixed;right:0;bottom:0;width:0;height:0;border:0';fr.src=blobUrl;
    fr.onload=function(){try{fr.contentWindow.focus();fr.contentWindow.print();}catch(e){}};
    document.body.appendChild(fr);
    say('인쇄 창을 여는 중이에요. 안 뜨면 팝업의 "합친 PDF 열기"를 눌러주세요.');
  }catch(e){S.busy=false;fail(e);return;}
  S.busy=false;render();
}
async function doDelete(key){
  var p=key.split(':'),kind=p[0],id=p.slice(1).join(':');
  try{
    if(kind==='tool'){await api.deleteTool(id);S.tools=S.tools.filter(function(t){return t.id!==id;});S.basket=S.basket.filter(function(x){return x!==id;});saveBasket();}
    if(kind==='script'){await api.deleteScript(id);S.scripts=S.scripts.filter(function(x){return x.id!==id;});}
    if(kind==='contact'){await api.deleteContact(id);S.contacts=S.contacts.filter(function(x){return x.id!==id;});}
    if(kind==='user'){await api.deleteMember(id);S.members=await api.members();}
    S.modal=null;say('지웠어요.');render();
  }catch(e){fail(e);}
}
document.addEventListener('input',function(e){
  var t=e.target;
  /* 입력창은 그대로 두고 결과만 바꿔서 한글 조합이 끊기지 않게 함 */
  if(t.id==='q'){S.q=t.value;var r=document.getElementById('results');if(r)r.innerHTML=vResults();}
  else if(t.id==='hosp'){S.hospital=t.value;var ht=document.getElementById('hosp-title');if(ht)ht.textContent=hospTitle();}
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.hasAttribute('data-print')){var pid=t.getAttribute('data-print');if(t.checked)S.printSel[pid]=true;else delete S.printSel[pid];render();return;}
  if(t.id==='scope'){S.scope=t.value;render();}
  else if(t.hasAttribute('data-req')){var id=t.getAttribute('data-req'),val=t.value;api.setReqStatus(id,val).then(function(){(S.reqs||[]).forEach(function(r){if(r.id===id)r.status=val;});say('상태를 바꿨어요.');render();}).catch(fail);}
});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){if(S.modal){S.modal=null;S.edit=null;render();}else if(S.present>=0){S.present=-1;S.presentUrl='';render();}}
});
function val(id){var el=document.getElementById(id);return el?el.value.trim():'';}
function checked(id){var el=document.getElementById(id);return !!(el&&el.checked);}
document.addEventListener('submit',async function(e){
  e.preventDefault();
  var f=e.target;if(S.busy)return;
  try{
    if(f.id==='loginForm'){
      var emp=normEmp(val('empId'));
      if(LIVE&&!emp){S.loginErr='사번을 넣어주세요.';render();return;}
      var pw=mrPw(emp);
      var keepOn=checked('keep'),asAdmin=checked('asAdmin');
      S.busy=true;S.loginErr='';render();
      try{var uid=await api.signIn(emp,pw,keepOn,asAdmin);await afterLogin(uid);track('login',null);}
      catch(err){S.loginErr=err&&err.code==='bad'?'등록되지 않은 사번이에요. 담당 CM에게 문의해 주세요.':'지금 서버가 잠시 멈춰 있어요. 담당 CM에게 알려주세요.';S.uid=null;}
      S.busy=false;render();return;
    }
    if(f.id==='reqForm'){
      var txt=val('reqText');if(!txt){say('필요한 툴이나 자료를 한 줄이라도 적어주세요.');render();return;}
      var area=val('reqArea');S.busy=true;render();await api.sendRequest(txt,area);track('request',null);
      S.modal=null;say('요청을 보냈어요. 다음 달 공략 툴 정할 때 반영합니다.');
    }
    if(f.id==='pwForm'){
      var p1=document.getElementById('pw1').value,p2=document.getElementById('pw2').value;
      if(p1.length<6){say('비밀번호는 6자 이상이어야 해요.');render();return;}
      if(p1!==p2){say('두 비밀번호가 달라요.');render();return;}
      S.busy=true;render();await api.changePassword(p1);S.modal=null;say('비밀번호를 바꿨어요.');
    }
    if(f.id==='toolForm'){
      var name=val('fName');if(!name){say('이름을 넣어주세요.');render();return;}
      var url=val('fUrl');if(url&&!/^https?:\/\//i.test(url)){say('주소는 https:// 로 시작해야 해요.');render();return;}
      var fileEl=document.getElementById('fFile'),file=fileEl&&fileEl.files&&fileEl.files[0]||null;
      var old=S.edit?byId(S.edit):null;
      var data={name:name,kind:val('fKind'),by:old?old.by:'',url:url,file:old&&!url?old.file:'',desc:val('fDesc'),pub:val('fPub'),
        tags:[].slice.call(f.querySelectorAll('input[name=tg]:checked')).map(function(x){return x.value;}),
        month:checked('fMonth'),doctor:checked('fDoc'),active:checked('fActive'),sort:old?old.sort:S.tools.length+1};
      S.busy=true;render();
      var saved=await api.saveTool(S.edit,data,file);
      if(S.edit){S.tools=S.tools.map(function(t){return t.id===S.edit?saved:t;});}else{S.tools.push(saved);}
      if(!saved.doctor||!saved.active){S.basket=S.basket.filter(function(x){return x!==saved.id;});saveBasket();}
      S.modal=null;S.edit=null;say('저장했어요. MR 화면에 바로 반영됩니다.');
    }
    if(f.id==='scriptForm'){
      var title=val('mTitle');if(!title){say('제목을 넣어주세요.');render();return;}
      var old2=S.edit?S.scripts.filter(function(x){return x.id===S.edit;})[0]:null;
      var sd={stage:val('mStage'),type:val('mType'),title:title,text:document.getElementById('mText').value,tool:val('mTool')||null,sort:old2?old2.sort:S.scripts.length+1};
      S.busy=true;render();
      var ms=await api.saveScript(S.edit,sd);
      if(S.edit){S.scripts=S.scripts.map(function(x){return x.id===S.edit?ms:x;});}else{S.scripts.push(ms);}
      S.modal=null;S.edit=null;say('저장했어요.');
    }
    if(f.id==='contactForm'){
      var topic=val('cTopic');if(!topic){say('어떤 문의인지 적어주세요.');render();return;}
      var old3=S.edit?S.contacts.filter(function(x){return x.id===S.edit;})[0]:null;
      var cd={topic:topic,dept:val('cDept'),tel:val('cTel'),tags:[].slice.call(f.querySelectorAll('input[name=tg]:checked')).map(function(x){return x.value;}),sort:old3?old3.sort:S.contacts.length+1};
      S.busy=true;render();
      var cs=await api.saveContact(S.edit,cd);
      if(S.edit){S.contacts=S.contacts.map(function(x){return x.id===S.edit?cs:x;});}else{S.contacts.push(cs);}
      S.modal=null;S.edit=null;say('저장했어요.');
    }
    if(f.id==='userForm'){
      var u={emp_no:normEmp(val('uEmp')),name:val('uName'),division:val('uDiv'),office:val('uOff'),role:val('uRole'),password:val('uPw')};
      if(!/^[0-9A-Za-z]{3,20}$/.test(u.emp_no)){say('사번은 영문·숫자 3~20자로 넣어주세요.');render();return;}
      if(u.role==='mr'){u.password=mrPw(u.emp_no);}
      else if(!S.edit&&u.password.length<6){say('관리자는 6자 이상 비밀번호가 필요해요.');render();return;}
      else if(u.password&&u.password.length<6){say('비밀번호는 6자 이상이어야 해요.');render();return;}
      S.busy=true;render();await api.upsertMember(u);S.members=await api.members();
      S.modal=null;S.edit=null;say(u.role==='mr'?'저장했어요. 이제 사번만으로 들어갈 수 있어요.':'저장했어요.');
    }
    if(f.id==='bulkForm'){
      var lines=document.getElementById('bulkText').value.split(/\r?\n/).map(function(l){return l.trim();}).filter(Boolean);
      if(!lines.length){say('붙여넣은 명단이 없어요.');render();return;}
      S.busy=true;render();var okN=0,bad=[];
      for(var i=0;i<lines.length;i++){
        var c=lines[i].split(/\t|,/).map(function(x){return x.trim();});c[0]=normEmp(c[0]);
        try{if(!/^[0-9A-Za-z]{3,20}$/.test(c[0]||''))throw new Error('형식');
          await api.upsertMember({emp_no:c[0],name:c[1]||'',division:c[2]||'',office:c[3]||'',role:'mr',password:mrPw(c[0])});okN++;}
        catch(err){bad.push(i+1);}
      }
      S.members=await api.members();S.modal=null;
      say(okN+'명 등록했어요.'+(bad.length?' '+bad.join(', ')+'번째 줄은 형식이 맞지 않아 건너뛰었어요.':''));
    }
  }catch(err){S.busy=false;fail(err);return;}
  S.busy=false;render();
});

(async function(){
  api.init();
  try{var uid=await api.session();if(uid)await afterLogin(uid);}
  catch(e){console.error(e);S.uid=null;}
  S.boot=false;render();
})();
})();
