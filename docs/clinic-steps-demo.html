<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>제안서 순서 시안 v2</title>
<style>
:root{--navy:#2E4A78;--ink:#1F2A3D;--muted:#5B6B82;--line:#E3E7EE}
*{box-sizing:border-box}
body{margin:0;background:#F3F5F9;font-family:'Pretendard','Noto Sans KR',system-ui,sans-serif;color:var(--ink);padding:24px 16px 60px}
.wrap{max-width:1040px;margin:0 auto}
.bar{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap;align-items:center}
.bar button{border:1px solid #C9D3E3;background:#fff;border-radius:999px;padding:8px 16px;font:inherit;font-weight:700;color:var(--navy);cursor:pointer}
.bar button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.bar .sp{width:14px}
.page{background:#fff;border-radius:18px;padding:30px 32px 36px;border:1px solid var(--line)}
h1{font-size:30px;margin:0 0 10px;color:var(--navy);letter-spacing:-.5px}
h1 em{font-style:normal;color:var(--ink)}
.hint{font-size:14px;color:var(--muted);margin:0 0 30px;padding:10px 14px;background:#F6F8FB;border-radius:10px;display:inline-block}
.v{display:none}.v.on{display:block}
.desc{font-size:12.5px;color:#8A97AB;margin:0 0 18px}

/* B 가로 스텝퍼: 항목 수에 맞춰 칸이 똑같이 나뉘고, 많으면 옆으로 넘겨 보기 */
.st{display:flex;overflow-x:auto;padding:6px 2px 14px;scroll-snap-type:x mandatory}
.st .s{flex:1 0 160px;max-width:220px;display:flex;flex-direction:column;align-items:center;gap:12px;cursor:pointer;text-align:center;position:relative;scroll-snap-align:start;padding:0 6px}
.st .s:not(:last-child):after{content:"";position:absolute;top:26px;left:calc(50% + 34px);right:calc(-50% + 34px);border-top:2px dashed #C9D3E3}
.st .c{width:52px;height:52px;border-radius:50%;background:#fff;border:2px solid var(--navy);color:var(--navy);font-weight:800;font-size:17px;display:flex;align-items:center;justify-content:center;transition:transform .15s,background .15s,color .15s;flex:none}
.st .s:hover .c{background:var(--navy);color:#fff;transform:translateY(-3px)}
.st .s:first-child .c{background:var(--navy);color:#fff;box-shadow:0 0 0 5px #E3EAF5}
.st .lb{font-size:15px;font-weight:700;line-height:1.4;word-break:keep-all}
.st .go{font-size:12.5px;font-weight:700;color:var(--navy);opacity:0;transition:opacity .15s;margin-top:-6px}
.st .s:hover .go{opacity:1}

/* A 세로 타임라인 v2: 번호·제목·열기 가 한 줄 기준선에 정렬 */
.tl{list-style:none;margin:0;padding:0;max-width:760px}
.tl li{display:grid;grid-template-columns:52px 1fr auto;align-items:center;column-gap:18px;position:relative;cursor:pointer}
.tl li:not(:last-child):before{content:"";position:absolute;left:25px;top:50%;height:100%;border-left:2px dashed #C9D3E3}
.tl .n{position:relative;z-index:1;width:52px;height:52px;border-radius:50%;background:#fff;border:2px solid var(--navy);color:var(--navy);font-weight:800;font-size:17px;display:flex;align-items:center;justify-content:center}
.tl li:first-child .n{background:var(--navy);color:#fff;box-shadow:0 0 0 5px #E3EAF5}
.tl .t{font-size:18px;font-weight:700;padding:16px 0;border-bottom:1px solid var(--line)}
.tl li:last-child .t{border-bottom:0}
.tl .go{font-size:14px;font-weight:700;color:var(--navy);opacity:0;transition:opacity .15s;padding-right:6px}
.tl li:hover .go{opacity:1}
.tl li:hover .n{background:var(--navy);color:#fff}
</style></head><body><div class="wrap">
<div class="bar"><button class="on" data-v="B">B · 가로 스텝퍼</button><button data-v="A">A · 세로 타임라인</button><span class="sp"></span><button class="on" data-n="4">자료 4개</button><button data-n="7">자료 7개</button></div>
<div class="page">
<h1><em>한빛내과의원</em> 원장님께 드리는 제안</h1>
<div class="hint">진료실에 들어가기 전, 01번 자료를 눌러 제안 화면을 열어두세요. 다음 자료는 "다음"으로 넘겨 진행하세요.</div>
<div class="v on" id="B"><p class="desc">칸이 항목 수만큼 똑같이 나뉩니다. 6개를 넘으면 줄을 바꾸지 않고 옆으로 밀어서 봅니다(순서가 꼬이지 않게).</p><div class="st" id="stB"></div></div>
<div class="v" id="A"><p class="desc">번호 · 제목 · 열기가 한 기준선에 맞춰 정렬. 마우스를 올리면 번호가 채워지고 '열기 →'가 나타납니다.</p><ol class="tl" id="tlA"></ol></div>
</div></div>
<script>
var all=['의사랑 연동 클릭형 프로토타입','일만사 제안서 고도화 (손실계산기 포함)','검진센터 제안 브로셔 (인쇄툴)','검진센터 제안 브로셔 A (혜택형)','검진센터 제안 브로셔 B (비대면관리형)','일만사 수익 시뮬레이터','일만사 등록 이지플래너'];
var n=4;
function draw(){var L=all.slice(0,n);
document.getElementById('stB').innerHTML=L.map(function(t,i){return '<div class="s"><span class="c">'+(i+1)+'</span><span class="lb">'+t+'</span><span class="go">열기 →</span></div>'}).join('');
document.getElementById('tlA').innerHTML=L.map(function(t,i){return '<li><span class="n">'+(i+1)+'</span><span class="t">'+t+'</span><span class="go">열기 →</span></li>'}).join('');}
document.querySelectorAll('[data-v]').forEach(function(b){b.onclick=function(){document.querySelectorAll('[data-v]').forEach(function(x){x.classList.toggle('on',x===b)});document.querySelectorAll('.v').forEach(function(v){v.classList.toggle('on',v.id===b.dataset.v)})}});
document.querySelectorAll('[data-n]').forEach(function(b){b.onclick=function(){document.querySelectorAll('[data-n]').forEach(function(x){x.classList.toggle('on',x===b)});n=+b.dataset.n;draw()}});
draw();
</script></body></html>
